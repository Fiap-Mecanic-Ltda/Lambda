name: CI/CD - Lambda de Autenticacao

# Build + testes das funcoes e deploy delas (as funcoes, o API Gateway, o VPC
# Link, as roles e os security groups sao declarados em infra/).
#
# - homologacao: build, testes e plan. Nao ha ambiente de homologacao na AWS
#   (decisao do time), entao nada e aplicado a partir desta branch.
# - main: build, testes, plan e apply AUTOMATICO, seguido do smoke test do
#   gateway. O job de apply usa o Environment "production": se ele tiver
#   revisores obrigatorios, o deploy espera a aprovacao depois do plan.
on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main, homologacao]
  workflow_dispatch:
    inputs:
      action:
        description: "O que rodar (apply exige aprovacao do Environment production)"
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"
  AWS_REGION: us-east-1

jobs:
  build-and-test:
    name: Build, testes e empacotamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MechanicLtda.Auth.sln

      - name: Build
        run: dotnet build MechanicLtda.Auth.sln --configuration Release --no-restore

      - name: Testes automatizados
        run: dotnet test MechanicLtda.Auth.sln --configuration Release --no-build --verbosity normal

      # Mesmo script usado localmente: publica em linux-x64 e zipa com os
      # arquivos na raiz, como o runtime dotnet8 espera.
      - name: Empacota a funcao
        run: ./scripts/build.sh

      - name: Publica o pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: function-zip
          path: build/function.zip
          retention-days: 5

  plan:
    name: Terraform plan
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      # O plan precisa do zip: aws_lambda_function le o arquivo para calcular o
      # source_code_hash.
      - name: Baixa o pacote da funcao
        uses: actions/download-artifact@v4
        with:
          name: function-zip
          path: build

      # Chave estatica do terraform-deployer: a mesma identidade que le os
      # states remotos dos stacks de Kubernetes e do banco.
      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false

  apply:
    name: Terraform apply (deploy das funcoes e do gateway)
    needs: [build-and-test, plan]
    # Automatico em push na main; manual (workflow_dispatch) so a partir da
    # main. Sem ambiente de homologacao, disparar o apply de outra branch
    # publicaria codigo nao revisado direto em producao.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: ubuntu-latest
    environment: production
    # Dois merges seguidos na main nao podem aplicar em paralelo sobre o mesmo
    # state; o segundo espera o primeiro terminar.
    concurrency:
      group: terraform-apply-lambda-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Baixa o pacote da funcao
        uses: actions/download-artifact@v4
        with:
          name: function-zip
          path: build

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          # Sem o wrapper: ele acrescenta linhas de log ao stdout, o que quebra
          # o $(terraform output -raw ...) usado nos passos abaixo.
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      # O apply refaz o plan em vez de reaproveitar o do job anterior: o arquivo
      # de plan traz os segredos lidos do SSM em texto puro, e publica-lo como
      # artefato do workflow os exporia a quem tem acesso de leitura ao repo.
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Endpoints publicados
        run: |
          echo "::notice::Gateway: $(terraform output -raw api_base_url)"
          echo "::notice::Login por e-mail e senha: $(terraform output -raw auth_endpoint)"
          echo "::notice::Autenticacao por CPF: $(terraform output -raw auth_cpf_endpoint)"

      # Prova de fora da AWS que cada salto responde: VPC Link ate os pods, a
      # Lambda com e sem ida ao banco e o authorizer. SMOKE_CPF (opcional) ativa
      # o fluxo completo do cliente com token.
      - name: Smoke test do gateway
        env:
          SMOKE_CPF: ${{ secrets.SMOKE_CPF }}
        run: bash ../scripts/smoke-test.sh "$(terraform output -raw api_base_url)"
